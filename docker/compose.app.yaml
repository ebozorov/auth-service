# Tayyor loyihani lokal Docker'da to'liq sinash: auth-service image (make build-image),
# PostgreSQL va Mailpit birga. Ishga tushirish: make compose-up, to'xtatish: make compose-down.
# Development uchun docker/compose.yaml (make services-up + make dev) alohida, bu fayl unga tegmaydi:
# boshqa project nomi, konteynerlar va volume. Servicelar compose'ning default network'ida.
name: auth-service-app

services:
  # Tayyor image, compose uni build ham, pull ham qilmaydi
  auth-service:
    image: auth-service:latest
    pull_policy: never
    container_name: auth-service-app
    # certs/private.pem 600 huquqli: konteyner fayl egasi nomidan o'qiydi (make compose-up beradi)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      APP_ENV: dev
      APP_PORT: 5000
      PUBLIC_URL: http://localhost:5000
      JWT_ISSUER: http://localhost:5000
      JWT_PRIVATE_KEY_PATH: certs/private.pem
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@localhost
    ports:
      - "5000:5000"
    volumes:
      - ../certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Port tashqariga ochilmaydi: faqat auth-service default network orqali ulanadi
  postgres:
    image: postgres:17-alpine
    container_name: auth-service-app-postgres
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Xatlarni ushlab oladi, UI: http://localhost:8025 (SMTP faqat ichki network'da)
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: auth-service-app-mailpit
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
