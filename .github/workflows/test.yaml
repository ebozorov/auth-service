name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # web/dist binary ichiga embed qilinadi, usiz Go kodi kompilyatsiya bo'lmaydi
      - run: make web-install web-build

      # web testlari, Go unit va integration testlar (testcontainers postgres/mailpit'ni o'zi ko'taradi)
      - run: make check
